<div class="seite">
  <header class="seiten-kopf">
    <h1>Einstellungen</h1>
  </header>

  <div class="karte">
    <h2>Serververbindung</h2>

    @if (storage.status() === 'verbunden') {
      <p class="ok verbunden">
        Verbunden mit <code>{{ adapter.aktiveBaseUrl() }}</code>
      </p>
      <button
        [disabled]="!daten.darfBearbeiten()"
        [title]="daten.darfBearbeiten() ? null : 'Mit dieser Rolle nur Lesezugriff'"
        type="button" (click)="trennen()"
      >
        Verbindung trennen
      </button>
      <p class="hinweis">
        Nach dem Trennen sind die Vereinsdaten erst wieder erreichbar, wenn Adresse und
        Schlüssel erneut eingetragen wurden.
      </p>
    } @else {
      <div class="formular">
        <label>
          API-Adresse
          <input
            type="text"
            name="baseUrl"
            inputmode="url"
            placeholder="api/api.php"
            [ngModel]="baseUrl()"
            (ngModelChange)="baseUrl.set($event)"
          />
          <small class="leise">
            Relativ (z.B. <code>api/api.php</code>), wenn die Anwendung auf demselben Server
            liegt — sonst vollständig mit https://
          </small>
        </label>

        <label>
          API-Key
          <input
            type="password"
            name="apiKey"
            autocomplete="current-password"
            [ngModel]="apiKey()"
            (ngModelChange)="apiKey.set($event)"
          />
          <small class="leise">Steht in der Datei <code>config.php</code> auf dem Server.</small>
        </label>

        <button type="button" class="primaer" [disabled]="laeuft()" (click)="verbinden()">
          {{ laeuft() ? 'Verbinde…' : 'Verbinden' }}
        </button>
      </div>

      @if (fehler()) {
        <p class="fehler">{{ fehler() }}</p>
      }
    }
  </div>
</div>
