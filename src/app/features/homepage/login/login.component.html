<div class="karte">
  <h2>Login</h2>
  @if(!loginService.istNutzerAngemeldet()) {
  <div class="formular-zeile">
    <label>
      Rolle
      <select [(ngModel)]="username">
        @for (rolle of rollenService.rollennamen(); track rolle) {
          <option value="{{rolle}}">{{ rolle }}</option>
        }
      </select>
    </label>
    <label>
      Passwort
      <input
        type="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        (keydown.enter)="login()"
      />
    </label>
    <button type="button" [disabled]="!password()" (click)="login()">anmelden</button>
  </div>
    @if (rollenService.namenLaden()) {
      <small class="leise">Rollen werden geladen...</small>
    }
    @if (loginService.fehler()) {
      <p class="fehler">{{loginService.fehler()}}</p>
    }
  } @else {
    <p>Angemeldet als {{ loginService.currentNutzer()?.username }}</p>
    <button type="button" (click)="logout()">Logout</button>
  }
</div>

<app-abmeldungen/>
